<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Java Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="calculator"><p class="tag">JAVA + MAVEN PROJECT</p><h1>Calculator</h1><p class="sub">A simple calculator powered by Java Spring Boot</p>
<label for="first">First number</label><input id="first" type="number" step="any" placeholder="Enter first number">
<label for="operation">Operation</label><select id="operation"><option value="add">Addition (+)</option><option value="subtract">Subtraction (−)</option><option value="multiply">Multiplication (×)</option><option value="divide">Division (÷)</option></select>
<label for="second">Second number</label><input id="second" type="number" step="any" placeholder="Enter second number">
<button id="calculate">Calculate</button><section class="result" aria-live="polite"><span>RESULT</span><strong id="result">—</strong><p id="message">Enter two numbers to begin.</p></section>
</main><script src="script.js"></script></body></html>
